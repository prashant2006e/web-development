<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .left-side, .right-side {
            padding: 10px;
        }

        .right-side {
            border-left: 2px solid black;
            min-height: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .right-side {
                border-left: none;
                border-top: 2px solid black;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Resume Builder</h1>
    <hr>

    <div class="container">
        <div class="left-side">
            <h2>Enter Details</h2>
            <form id="resumeForm">
                
                <div class="form-group">
                    <label>Name:</label><br>
                    <input type="text" id="nameInput" placeholder="b prashant">
                </div>

                <div class="form-group">
                    <label>Email:</label><br>
                    <input type="text" id="emailInput" placeholder="prashant@example.com">
                </div>

                <div class="form-group">
                    <label>Phone:</label><br>
                    <input type="text" id="phoneInput" placeholder="123-456-7890">
                </div>

                <div class="form-group">
                    <label><b>Experience:</b></label>
                    <div id="experienceBox"></div>
                    <button type="button" id="addExpBtn">+ Add Job</button>
                </div>

                <div class="form-group">
                    <label><b>Skills:</b></label>
                    <div id="skillsBox"></div>
                    <button type="button" id="addSkillBtn">+ Add Skill</button>
                </div>

                <p id="errorMessage" class="error"></p>
                <button type="submit">Save Changes</button>
            </form>
        </div>

        <div class="right-side">
            <h2>Live Preview</h2>
            
            <h1 id="viewName">Your Name</h1>
            <p>Email: <span id="viewEmail"></span></p>
            <p>Phone: <span id="viewPhone"></span></p>

            <h3>Work History</h3>
            <div id="viewExperience"></div>

            <h3>Skills</h3>
            <ul id="viewSkills"></ul>
        </div>
    </div>

<script>
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const phoneInput = document.getElementById('phoneInput');
    
    const experienceBox = document.getElementById('experienceBox');
    const skillsBox = document.getElementById('skillsBox');
    
    const viewName = document.getElementById('viewName');
    const viewEmail = document.getElementById('viewEmail');
    const viewPhone = document.getElementById('viewPhone');
    const viewExperience = document.getElementById('viewExperience');
    const viewSkills = document.getElementById('viewSkills');
    
    const errorMessage = document.getElementById('errorMessage');
    const resumeForm = document.getElementById('resumeForm');

    window.onload = function() {
        loadSavedData();
        updatePreview();
    };

    nameInput.oninput = updatePreview;
    emailInput.oninput = updatePreview;
    phoneInput.oninput = updatePreview;

    document.getElementById('addExpBtn').onclick = function() {
        createNewInputRow(experienceBox, 'Job Title & Company');
    };

    document.getElementById('addSkillBtn').onclick = function() {
        createNewInputRow(skillsBox, 'Skill (e.g. HTML)');
    };

    function createNewInputRow(container, placeholderText, existingValue = "") {
        const div = document.createElement('div');
        div.style.marginBottom = "5px";

        const input = document.createElement('input');
        input.type = "text";
        input.placeholder = placeholderText;
        input.value = existingValue;
        
        input.oninput = updatePreview;

        const removeBtn = document.createElement('button');
        removeBtn.type = "button";
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "5px";
        
        removeBtn.onclick = function() {
            div.remove();
            updatePreview();
        };

        div.appendChild(input);
        div.appendChild(removeBtn);
        container.appendChild(div);
        
        updatePreview();
    }

    function updatePreview() {
        viewName.textContent = nameInput.value || "Your Name";
        viewEmail.textContent = emailInput.value || "example@mail.com";
        viewPhone.textContent = phoneInput.value || "000-000-0000";

        viewExperience.innerHTML = "";
        const expInputs = experienceBox.getElementsByTagName('input');
        for (let i = 0; i < expInputs.length; i++) {
            if (expInputs[i].value !== "") {
                const p = document.createElement('p');
                p.textContent = "- " + expInputs[i].value;
                viewExperience.appendChild(p);
            }
        }

        viewSkills.innerHTML = "";
        const skillInputs = skillsBox.getElementsByTagName('input');
        for (let i = 0; i < skillInputs.length; i++) {
            if (skillInputs[i].value !== "") {
                const li = document.createElement('li');
                li.textContent = skillInputs[i].value;
                viewSkills.appendChild(li);
            }
        }
    }

    resumeForm.onsubmit = function(event) {
        event.preventDefault();

        if (nameInput.value === "" || emailInput.value === "" || phoneInput.value === "") {
            errorMessage.textContent = "Error: Please fill out Name, Email, and Phone.";
            return;
        }

        const allInputs = resumeForm.getElementsByTagName('input');
        for (let i = 0; i < allInputs.length; i++) {
            if (allInputs[i].value === "") {
                errorMessage.textContent = "Error: Do not leave added fields empty.";
                return;
            }
        }

        errorMessage.textContent = "";
        
        const expArray = [];
        const expInputs = experienceBox.getElementsByTagName('input');
        for(let i=0; i<expInputs.length; i++) {
            expArray.push(expInputs[i].value);
        }

        const skillArray = [];
        const skillInputs = skillsBox.getElementsByTagName('input');
        for(let i=0; i<skillInputs.length; i++) {
            skillArray.push(skillInputs[i].value);
        }

        localStorage.setItem('name', nameInput.value);
        localStorage.setItem('email', emailInput.value);
        localStorage.setItem('phone', phoneInput.value);
        localStorage.setItem('experiences', JSON.stringify(expArray));
        localStorage.setItem('skills', JSON.stringify(skillArray));

        alert("Resume successfully saved!");
    };

    function loadSavedData() {
        if(localStorage.getItem('name')) {
            nameInput.value = localStorage.getItem('name');
            emailInput.value = localStorage.getItem('email');
            phoneInput.value = localStorage.getItem('phone');

            const savedExps = JSON.parse(localStorage.getItem('experiences') || "[]");
            for(let i=0; i<savedExps.length; i++) {
                createNewInputRow(experienceBox, 'Job Title & Company', savedExps[i]);
            }

            const savedSkills = JSON.parse(localStorage.getItem('skills') || "[]");
            for(let i=0; i<savedSkills.length; i++) {
                createNewInputRow(skillsBox, 'Skill (e.g. HTML)', savedSkills[i]);
            }
        }
    }
</script>

</body>
</html>
